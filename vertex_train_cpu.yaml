workerPoolSpecs:
  machineSpec:
    machineType: n1-highmem-2
  replicaCount: 1
  containerSpec:
    imageUri: europe-west3-docker.pkg.dev/mlops-483916/my-container-registry/train:latest
    args:
      - --data-dir=/gcs/mlops_data_bucket_88/data/processed/train
      - --epochs-phase1=10
      - --epochs-phase2=10
      - --batch-size=128
    env:
      - name: WANDB_API_KEY
        valueFrom:
          secretKeyRef:
            name: WANDB_API_KEY
            key: latest
