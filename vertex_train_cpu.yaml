workerPoolSpecs:
  machineSpec:
    machineType: n1-highmem-2
  replicaCount: 1
  containerSpec:
    imageUri: europe-west3-docker.pkg.dev/mlops-483916/my-container-registry/train:latest
    command:
      - python
      - src/xray_image_classifier/train.py
    args:
      - --epochs=20
      - --batch-size=128
    env:
      - name: WANDB_API_KEY
        value: $WANDB_API_KEY
